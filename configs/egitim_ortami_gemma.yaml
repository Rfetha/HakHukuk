# Eğitim ortamı kilidi — Gemma 4 E4B (docs/yontem/EGITIM_ORTAMI.md §6 m.6; bulgular kronoloji #78-#79).
# Qwen3.5-4B'nin kilidi `egitim_ortami.yaml`dır ve DEĞİŞMEZ; bu dosya ondan yalnız şu alanlarda ayrılır:
# model · tur işaretleri · paket kilidi (unsloth/unsloth_zoo 2026.10.1) · ek paketler (fla yok: Gemma
# doğrusal-dikkat katmanı taşımıyor) · LoRA hedefi (yalnız dil kulesi). Tarifler ve seedler aynıdır:
# tek değişken model. Modal'da imaj bu dosyadan kurulur; betikler `--ortam-kilidi` ile bunu ister.

model: google/gemma-4-E4B-it
tur_isaretleri:                       # train_on_responses_only; render'a karşı ayrıca assert edilir
  user_part: "<|turn>user\n"
  assistant_part: "<|turn>model\n"

gpu:
  modal_dizesi: A100-40GB            # yalnız "A100" 40 ya da 80 GB verebilir (tuzak 6.7)
  ad_oneki: NVIDIA A100              # torch.cuda.get_device_name(0) bununla başlar
  hesaplama_surumu: [8, 0]

yukleme:                             # FastModel.from_pretrained'e eklenir (ortam_kilidi.yukleme_secenekleri)
  use_exact_model_name: true         # yoksa Unsloth unsloth/gemma-4-E4B-it'i yükler (#79)

python: "3.11"

paketler:
  kilit_dosyasi: requirements.gemma4.lock.txt
  kilit_sha256: c18beb05be7af11f40a766f0eb3fa68aed802885e20c1be8caf1ac5fde106ba7
  surumler:                          # importlib.metadata; yerel ek (+cu130 gibi) karşılaştırmada soyulur
    torch: 2.10.0
    triton: 3.6.0
    transformers: 5.10.2
    peft: 0.19.1
    trl: 0.24.0
    unsloth: 2026.10.1
    unsloth_zoo: 2026.10.1
    accelerate: 1.13.0
    bitsandbytes: 0.49.2
    datasets: 4.3.0
  ek:                                # kilit dosyasında yok; imaja ayrıca, --no-deps ile kurulur
    einops: 0.8.2                    # Qwen'le aynı sürüm; fla-core/flash-linear-attention Gemma'da yok
  yasak: [causal-conv1d]             # tavan 1,254×, ≥2× kapısından kaldı (#44)

hassasiyet: bf16-taban               # varsayılan YOK; betikler --hassasiyet ister (ADR-0031)

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  use_rslora: false
  # Düz 7 adlık liste Gemma'da görüntü (112) ve ses (36) kulesindeki `Gemma4ClippableLinear`lere de
  # takılıyor (#79); bu desen yalnız dil kulesini seçer (258 modül). Tek elemanlı liste, regex.
  hedef_moduller: ['model\.language_model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|mlp\.(gate_proj|up_proj|down_proj))']
  yerlesim:                          # get_peft_model sonrası denetlenir; tutmazsa koşu başlamadan durur
    yol_oneki: model.language_model.
    modul_sayisi: 258                # q 42 · k 24 · v 24 · o 42 · gate/up/down 42'şer

tarifler:
  sft:                               # τ_g; komut: 9f4b43d:docs/record/sprint1/NEXT-SESSION.md:59-64
    veri: raft_scrubbed              # data/train/raft_scrubbed/ (Modal: /data/raft_scrubbed)
    satir: 17323                     # train.jsonl
    max_seq_len: 2048
    batch: 2
    grad_accum: 8
    grad_checkpoint: false           # ADR-0033
    lr: 1.0e-4
    zamanlayici: cosine
    optim: adamw_8bit
    warmup_ratio: 0.05
    epochs: 1
    adim: 1083
    packing: false
    sistem_istemi: false             # --no-system: veri sistem istemini zaten taşımıyor
  orpo:                              # τ_a; koşu satırı: kronoloji-39-52.md #48
    veri: orpo_abstain_cp2c          # data/train/orpo_abstain_cp2c/ (Modal: /data/orpo_abstain_cp2c)
    satir: 845                       # train.jsonl (726 çift + 145 tekrar ve replay; 26 doğrulama)
    max_length: 2048
    max_prompt_length: 1536
    batch: 1
    grad_accum: 64
    grad_checkpoint: true            # train_orpo.py'de koda gömülü ("unsloth")
    lr: 1.0e-5
    beta: 0.1
    zamanlayici: cosine
    optim: adamw_8bit
    warmup_ratio: 0.05
    epochs: 5
    adim: 70
    taze_adaptor: true               # --fresh-adapter; --adapter verilmez

seedler: [3407, 3408, 3409]          # iki temel modelde aynı liste; sonuç görülmeden seçildi
